<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum JS</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">💬 Forum JS</a>
        <div class="nav-actions" id="navActions">
            <a href="/login.html" class="btn btn-outline">Connexion</a>
            <a href="/register.html" class="btn btn-primary">Inscription</a>
        </div>
    </nav>

    <div class="container">
        <div class="sidebar">
            <h3>Filtres</h3>
            <ul class="filter-list">
                <li><a href="#" class="filter-link active" data-filter="all">Tous les posts</a></li>
                <li id="myPostsFilter" style="display:none">
                    <a href="#" class="filter-link" data-filter="my">Mes posts</a>
                </li>
                <li id="likedPostsFilter" style="display:none">
                    <a href="#" class="filter-link" data-filter="liked">Posts aimés</a>
                </li>
            </ul>
            <h3 style="margin-top:1.5rem">Catégories</h3>
            <ul class="filter-list" id="categoryList"></ul>
        </div>

        <main class="main-content">
            <div class="posts-header">
                <h2 id="postsTitle">Tous les posts</h2>
                <button id="newPostBtn" class="btn btn-primary" style="display:none" onclick="openPostModal()">+ Nouveau post</button>
            </div>
            <div id="postsContainer" class="posts-grid"></div>
        </main>
    </div>

    <!-- Modal nouveau post -->
    <div id="postModal" class="modal hidden">
        <div class="modal-box">
            <h2>Nouveau post</h2>
            <form id="postForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Titre *</label>
                    <input type="text" id="postTitle" required placeholder="Titre du post">
                </div>
                <div class="form-group">
                    <label>Contenu *</label>
                    <textarea id="postContent" required rows="5" placeholder="Contenu..."></textarea>
                </div>
                <div class="form-group">
                    <label>Catégories</label>
                    <div id="categoryCheckboxes" class="checkbox-group"></div>
                </div>
                <div class="form-group">
                    <label>Image (optionnel – JPEG/PNG/GIF, max 20 Mo)</label>
                    <input type="file" id="postImage" accept="image/jpeg,image/png,image/gif">
                </div>
                <p id="postError" class="error-msg"></p>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closePostModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Publier</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/index.js"></script>
</body>
</html>
