<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription – Forum JS</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">💬 Forum JS</a>
    </nav>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Créer un compte</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="username" required placeholder="Pseudo">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required placeholder="Min. 6 caractères" minlength="6">
                </div>
                <p id="registerError" class="error-msg"></p>
                <button type="submit" class="btn btn-primary btn-full">S'inscrire</button>
            </form>
            <p class="auth-link">Déjà un compte ? <a href="/login.html">Se connecter</a></p>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
