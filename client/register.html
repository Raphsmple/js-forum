<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription – FORUM_JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Animated background with floating geometric shapes -->
    <div class="bg-scene" aria-hidden="true">
        <div class="stars"></div>
        <div class="stars stars-2"></div>
        <div class="orb orb-rose"></div>
        <div class="orb orb-cyan"></div>
        <div class="bg-grid"></div>
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="scanline"></div>
    </div>

    <nav class="navbar">
        <a href="/" class="logo glitch" data-text="FORUM_JS">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <defs>
                    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#7c3aed"/>
                        <stop offset="1" stop-color="#06b6d4"/>
                    </linearGradient>
                </defs>
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>
            </svg>
            FORUM_JS
        </a>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <p class="auth-kicker">// nouvelle identité</p>
            <h2>Créer un compte</h2>
            <form id="registerForm">
                <div class="field">
                    <input type="text" id="username" required placeholder=" " autocomplete="username">
                    <label for="username">Nom d'utilisateur</label>
                </div>
                <div class="field">
                    <input type="email" id="email" required placeholder=" " autocomplete="email">
                    <label for="email">Email</label>
                </div>
                <div class="field">
                    <input type="password" id="password" required placeholder=" " minlength="6" autocomplete="new-password">
                    <label for="password">Mot de passe (min. 6 caractères)</label>
                </div>
                <p id="registerError" class="error-msg"></p>
                <button type="submit" class="btn btn-primary btn-full">S'inscrire</button>
            </form>
            <p class="auth-link">Déjà un compte ? <a href="/login.html">Se connecter</a></p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
